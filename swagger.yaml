openapi: 3.0.3
info:
  title: Oficina Mecânica API
  description: |
    API REST do Sistema Integrado de Atendimento e Execução de Serviços.

    **Arquitetura:** Domain-Driven Design (DDD) em PHP 8.2 puro, sem frameworks MVC.

    **Autenticação (Fase 3):** um único bearer JWT **HS256** vale para os dois perfis. O token
    de `role=customer` é emitido pela Lambda `auth-cpf` (`POST /auth/cpf`); o de `role=admin` é
    emitido pela própria aplicação (`POST /api/auth/login`). Ambos usam o mesmo segredo
    (`JWT_SECRET`) e o mesmo emissor (`iss: oficina-mecanica-api`), e a aplicação **revalida o
    token localmente** em toda rota protegida — headers injetados pelo API Gateway nunca são
    considerados confiáveis.

    Claims: `sub` (id do cliente quando `customer`, usuário admin quando `admin`), `role`,
    `iss`, `iat`, `exp` e, só para `customer`, `cpf` e `name`.

    **Matriz de autorização:**

    | Rota | Acesso |
    |---|---|
    | `GET /api/health` | público — liveness, não toca no banco |
    | `GET /api/ready` | público — readiness, checa o banco |
    | `POST /auth/cpf` | público (API Gateway → Lambda) |
    | `POST /api/auth/login` | público (admin obtém o token) |
    | `GET /api/service-orders/me` | `customer` ou `admin` |
    | `GET /api/service-orders/{id}` | `admin`, ou o `customer` dono da ordem |
    | **todo o resto de `/api/**`** | `admin` |

    Ou seja: exceto `health`, `ready`, `login`, `me` e a consulta de uma ordem pelo
    próprio dono, **todas as demais rotas exigem `role=admin`** e respondem `403` para um token
    de cliente.

    **Fase 4:** este é o serviço de OS e o orquestrador da saga (docs/fase-4/CONTRATOS.md). Abrir
    uma OS inicia a saga; daí em diante o status é movido pelos eventos da Execução e do
    Faturamento, e só a entrega e o cancelamento são manuais. Catálogo, estoque, orçamento,
    aprovação e pagamento estão no serviço de Faturamento (`/api/billing`); diagnóstico e
    reparo, no de Execução (`/api/execution`).

    **Erros:** Todos os erros retornam `{"error": "mensagem descritiva"}`. Códigos:
    - `400` — Campos obrigatórios ausentes ou inválidos
    - `401` — Token ausente, inválido ou expirado
    - `403` — Token válido, mas sem o perfil exigido pela rota
    - `404` — Recurso não encontrado (também usado quando um cliente consulta ordem de outro,
      para não revelar a existência do recurso)
    - `422` — Violação de regra de negócio
    - `500` — Erro interno do servidor

    > O rate limit de login deixou de ser feito na aplicação (contador em arquivo, inútil com
    > múltiplos Pods) e passou a ser throttling do API Gateway.
  version: 1.0.0
  contact:
    name: Oficina Mecânica API

servers:
  - url: http://localhost:8080/api
    description: Ambiente local Docker (rotas `/api/**`)
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/api
    description: API Gateway (hml/prod) — rotas `/api/**` via VPC Link até a aplicação
    variables:
      apiId:
        default: xxxxxxxxxx
        description: Id do HTTP API publicado em /oficina/<env>/apigw/api_id

tags:
  - name: Sistema
    description: Health check e monitoramento
  - name: Autenticação
    description: Geração de token JWT
  - name: Clientes
    description: Gerenciamento de clientes
  - name: Veículos
    description: Gerenciamento de veículos
  - name: Ordens de Serviço
    description: Abertura (inicia a saga), consulta com o andamento da saga, entrega e cancelamento

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer JWT **HS256** — o mesmo esquema serve aos dois perfis:

        - `role=admin`: token de `POST /api/auth/login` (`sub` = usuário admin).
        - `role=customer`: token de `POST /auth/cpf`, emitido pela Lambda de autenticação
          (`sub` = id do cliente, mais as claims `cpf` e `name`).

        A aplicação valida assinatura e expiração localmente e aplica a matriz de autorização
        descrita na introdução: fora das exceções listadas lá, `/api/**` exige `role=admin`.

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Token expirado ou invalido
    Forbidden:
      description: Token válido, porém sem o perfil exigido pela rota
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Acesso negado.
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Dados de entrada inválidos ou obrigatórios ausentes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Regra de negócio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Mensagem de erro descritiva.

    CustomerStatus:
      type: string
      description: |
        Situação cadastral do cliente. Apenas `ACTIVE` autentica em `POST /auth/cpf`;
        `INACTIVE` e `BLOCKED` recebem `403`.
      enum:
        - ACTIVE
        - INACTIVE
        - BLOCKED
      default: ACTIVE
      example: ACTIVE

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: João da Silva
        document:
          type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos), apenas dígitos
          example: "52998224725"
        status:
          $ref: '#/components/schemas/CustomerStatus'
        email:
          type: string
          format: email
          nullable: true
          description: E-mail de contato; `null` quando não informado
          example: joao.silva@example.com
        phone:
          type: string
          nullable: true
          description: |
            Telefone de contato normalizado para apenas dígitos (DDD + número, 10 a 13 dígitos);
            `null` quando não informado
          example: "11987654321"
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name: João da Silva
        document: "52998224725"
        status: ACTIVE
        email: joao.silva@example.com
        phone: "11987654321"

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        license_plate:
          type: string
          description: Formato antigo (ABC-1234) ou Mercosul (ABC1D23)
          example: ABC-1234
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Corolla
        year:
          type: integer
          minimum: 1886
          example: 2020

    OrderStatus:
      type: string
      enum:
        - RECEIVED
        - DIAGNOSIS
        - AWAITING_APPROVAL
        - AWAITING_PAYMENT
        - EXECUTING
        - REJECTED
        - FINISHED
        - DELIVERED
        - CANCELLED

    ServiceOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/Customer'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: number
          format: float
          example: 558.00
          description: Total do orçamento, vindo do Faturamento
        budget_id:
          type: string
          nullable: true
          description: Orçamento no serviço de Faturamento
        payment_url:
          type: string
          nullable: true
          description: Link de pagamento, só enquanto `AWAITING_PAYMENT`
        created_at:
          type: string
          format: date-time
        saga:
          $ref: '#/components/schemas/Saga'

    Saga:
      type: object
      nullable: true
      description: Andamento da saga (OS da Fase 3, abertas antes da saga, não têm)
      properties:
        id: { type: string }
        state:
          type: string
          enum: [RUNNING, COMPENSATING, COMPLETED, COMPENSATED, FAILED]
        step:
          type: string
          enum: [DIAGNOSIS, BUDGET, APPROVAL, PAYMENT, REPAIR, DONE]
        failed_step: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        deadline_at: { type: string, format: date-time, nullable: true }
        pending_compensations:
          type: array
          items: { type: string, example: billing.cancel-budget }
        history:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              event: { type: string, example: step.entered }
              step: { type: string }
              detail: { type: string, nullable: true }

security:
  - BearerAuth: []

paths:
  # ── Sistema ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Sistema]
      summary: Liveness — o processo está vivo
      description: |
        Sonda de **liveness** do Kubernetes. **Não toca no banco de dados**: uma sonda de
        liveness acoplada ao banco transforma uma instabilidade momentânea do RDS em reinício
        em cascata de todos os Pods. A saúde do banco é responsabilidade de `GET /api/ready`.

        Sempre responde `200` enquanto o processo consegue atender.
      security: []
      responses:
        '200':
          description: Processo vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
              example:
                status: ok
                version: 1.0.0
                timestamp: '2026-08-26T22:31:04+00:00'

  /ready:
    get:
      tags: [Sistema]
      summary: Readiness — dependências disponíveis
      description: |
        Sonda de **readiness**: executa `SELECT 1` no banco. Falhando, o Pod é retirado do
        balanceador (`503`) sem ser reiniciado.
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                    example: ready
                  version:
                    type: string
                    example: 1.0.0
                  database:
                    type: string
                    enum: [connected]
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Banco de dados indisponível — Pod não está pronto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [not_ready]
                    example: not_ready
                  version:
                    type: string
                    example: 1.0.0
                  database:
                    type: string
                    enum: [error]
                    example: error
                  timestamp:
                    type: string
                    format: date-time

  # ── Autenticação ──────────────────────────────────────────────────────────────
  /auth/cpf:
    post:
      tags: [Autenticação]
      summary: Autenticar cliente por CPF e obter token JWT (perfil customer)
      description: |
        **Servida pela Lambda `auth-cpf` através do API Gateway, não pela aplicação PHP.**
        A rota fica **fora** do prefixo `/api`: no gateway ela é `POST {apigw}/auth/cpf`
        (nos servidores declarados acima, que já incluem `/api`, use `../auth/cpf`).

        Aceita **somente CPF** (11 dígitos, com ou sem máscara); CNPJ é recusado com `400`.
        O token devolvido é o mesmo bearer HS256 aceito pela aplicação, com `role=customer`,
        `sub` = id do cliente e as claims `cpf` e `name`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf:
                  type: string
                  description: CPF com ou sem máscara
                  example: 529.982.247-25
            example:
              cpf: "52998224725"
      responses:
        '200':
          description: CPF válido e cliente ACTIVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn:
                    type: integer
                    description: Validade do token em segundos
                    example: 3600
                  customer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
                customer:
                  id: 11111111-1111-4111-8111-111111111111
                  name: Maria Souza
        '400':
          description: |
            CPF com dígito verificador inválido, CNPJ, ou campo `cpf` ausente/vazio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cpfInvalido:
                  summary: Dígito verificador inválido (ou CNPJ)
                  value:
                    error: CPF inválido.
                cpfAusente:
                  summary: Campo ausente ou vazio
                  value:
                    error: O campo cpf é obrigatório.
        '403':
          description: Cliente com status INACTIVE ou BLOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cliente inativo. Procure a oficina.
        '404':
          description: CPF não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cliente não encontrado.
        '500':
          description: Falha de banco ou erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Erro interno.

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Realizar login do administrador e obter token JWT (perfil admin)
      description: |
        Emite o bearer JWT de `role=admin`. É a única rota de `/api/**` liberada sem token pelo
        authorizer do API Gateway. Throttling é aplicado no estágio do gateway.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: Token gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Clientes ──────────────────────────────────────────────────────────────────
  /customers:
    get:
      tags: [Clientes]
      summary: Listar todos os clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Clientes]
      summary: Criar novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, document]
              properties:
                name:
                  type: string
                  example: João da Silva
                document:
                  type: string
                  description: CPF ou CNPJ (com ou sem formatação)
                  example: 529.982.247-25
                status:
                  allOf:
                    - $ref: '#/components/schemas/CustomerStatus'
                  description: Opcional; assume `ACTIVE` quando ausente
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Opcional
                  example: joao.silva@example.com
                phone:
                  type: string
                  nullable: true
                  description: Opcional; aceita máscara e é normalizado para dígitos
                  example: (11) 98765-4321
            example:
              name: João da Silva
              document: "529.982.247-25"
              status: ACTIVE
              email: joao.silva@example.com
              phone: (11) 98765-4321
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Clientes]
      summary: Buscar cliente por ID
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clientes]
      summary: Atualizar cliente (nome, situação e contato)
      description: |
        O documento é imutável. Campos opcionais ausentes preservam o valor atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: João Atualizado da Silva
                status:
                  allOf:
                    - $ref: '#/components/schemas/CustomerStatus'
                  description: Opcional; mantém o status atual quando ausente
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Opcional; mantém o valor atual quando ausente
                  example: joao.silva@example.com
                phone:
                  type: string
                  nullable: true
                  description: Opcional; mantém o valor atual quando ausente
                  example: (11) 98765-4321
            example:
              name: João Atualizado da Silva
              status: BLOCKED
              email: joao.silva@example.com
              phone: (11) 98765-4321
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Clientes]
      summary: Remover cliente
      responses:
        '204':
          description: Cliente removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Veículos ──────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      tags: [Veículos]
      summary: Listar todos os veículos
      responses:
        '200':
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags: [Veículos]
      summary: Cadastrar veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, license_plate, brand, model, year]
              properties:
                customer_id:
                  type: string
                  format: uuid
                license_plate:
                  type: string
                  example: ABC-1234
                brand:
                  type: string
                  example: Toyota
                model:
                  type: string
                  example: Corolla
                year:
                  type: integer
                  minimum: 1886
                  example: 2020
            example:
              customer_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              license_plate: ABC-1234
              brand: Toyota
              model: Corolla
              year: 2020
      responses:
        '201':
          description: Veículo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /vehicles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Veículos]
      summary: Buscar veículo por ID
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Veículos]
      summary: Atualizar dados do veículo (brand, model, year)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, model, year]
              properties:
                brand:
                  type: string
                  example: Honda
                model:
                  type: string
                  example: Civic
                year:
                  type: integer
                  example: 2022
      responses:
        '200':
          description: Veículo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Veículos]
      summary: Remover veículo
      responses:
        '204':
          description: Veículo removido
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Ordens de Serviço ─────────────────────────────────────────────────────────
  /service-orders:
    get:
      tags: [Ordens de Serviço]
      summary: Listar ordens de serviço ativas
      description: |
        Retorna as ordens **ativas** ordenadas por prioridade de fluxo
        (`EXECUTING` > `AWAITING_PAYMENT` > `AWAITING_APPROVAL` > `DIAGNOSIS` > `RECEIVED`) e,
        dentro de cada status, das mais antigas para as mais recentes. Ordens encerradas
        (`FINISHED`, `DELIVERED`, `REJECTED`, `CANCELLED`) são excluídas da listagem.
      responses:
        '200':
          description: Lista de ordens ativas ordenadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOrder'
    post:
      tags: [Ordens de Serviço]
      summary: Abrir ordem de serviço e iniciar a saga
      description: |
        Grava a OS (`RECEIVED`) e a saga dela na mesma transação, com o pedido de diagnóstico
        para a Execução na outbox. A resposta já traz a saga no passo `DIAGNOSIS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, vehicle_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
                vehicle_id:
                  type: string
                  format: uuid
                description:
                  type: string
                  description: O que o cliente relatou; vai no pedido de diagnóstico
            example:
              customer_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              vehicle_id: 8b1e4d07-1234-4000-a000-000000000001
              description: Barulho no freio dianteiro
      responses:
        '201':
          description: Ordem criada com status RECEIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-orders/me:
    get:
      tags: [Ordens de Serviço]
      summary: Ordens de serviço do próprio cliente autenticado
      description: |
        Devolve **apenas** as ordens do cliente identificado pela claim `sub` do token — o id
        nunca vem de parâmetro de entrada. Aceita `role=customer` e `role=admin`.

        Substitui a antiga rota pública `GET /api/service-orders/status`, **removida** por
        aceitar `document` e `license_plate` em query string e expor ordens de qualquer CPF.
      responses:
        '200':
          description: Ordens do cliente, das mais recentes para as mais antigas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /service-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Ordens de Serviço]
      summary: Buscar ordem por ID
      description: |
        Acesso: `role=admin`, ou o `role=customer` **dono** da ordem (claim `sub` igual ao
        cliente da ordem).

        Um cliente que consulta a ordem de outro recebe **`404`, não `403`** — responder `403`
        confirmaria a existência da ordem.
      responses:
        '200':
          description: Ordem encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Ordem inexistente — ou pertencente a outro cliente, quando o token é de `customer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /service-orders/{id}/delivery:
    post:
      tags: [Ordens de Serviço]
      summary: Entregar o veículo (FINISHED → DELIVERED)
      description: |
        A entrega é manual e fica fora da saga. Só depois de o reparo terminar (`FINISHED`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ordem entregue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /service-orders/{id}/cancellation:
    post:
      tags: [Ordens de Serviço]
      summary: Cancelar a ordem de serviço
      description: |
        Cancela a OS e inicia a compensação do que a saga já fez (docs/fase-4/CONTRATOS.md §6.2):
        no diagnóstico, cancela a tarefa na Execução; com orçamento, cancela o orçamento (e
        libera as peças); em reparo, também estorna o pagamento. A OS vai para `CANCELLED` na
        hora; a saga fica em `COMPENSATING` até as confirmações chegarem. Recusado depois de
        `FINISHED`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: cliente desistiu do serviço
      responses:
        '200':
          description: Ordem cancelada, compensação em andamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A ordem mudou enquanto a operação corria; tente de novo
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
