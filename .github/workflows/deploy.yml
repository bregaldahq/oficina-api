name: Deploy

# Seção 9 dos Contratos:
#   push em `develop` → ambiente `homologacao` (namespace oficina-hml)
#   push em `main`    → ambiente `producao`    (namespace oficina-prod)
#
# Autenticação AWS exclusivamente por OIDC (nenhuma access key estática).
# Todo o acoplamento com os outros repositórios é lido do SSM Parameter Store.
on:
  # Homologação sobe a cada merge em `develop`. Produção não sobe sozinha: um merge em `main` é
  # decisão de código, e aplicar em produção é decisão de operação (o mesmo dos repos de infra
  # e do gateway). Para produção, dispare este workflow com a ref `main`.
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      migrations_ref:
        description: "Ref do repositório oficina-infra-fundacao com as migrations"
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  deploy:
    name: Build, publish e deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
    env:
      AWS_REGION: us-east-1
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'hml' }}
      OVERLAY: ${{ github.ref == 'refs/heads/main' && 'deploy/overlays/prod' || 'deploy/overlays/hml' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Testes, cobertura mínima e BDD (o deploy não segue sem isso)
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit --coverage-clover coverage.xml
          php bin/check-coverage.php coverage.xml 80
          vendor/bin/behat --no-colors

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # Fase 4 (docs/fase-4/CONTRATOS.md, adendo F4-2): fila, DLQ, assinatura e role IRSA da saga.
      # A chave do state usa o nome antigo do repo, como os roles de CI e a tag Repo.
      - name: Infra do serviço (terraform apply)
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina/oficina-mecanica-tech-challenge/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=oficina-tflock" \
            -backend-config="encrypt=true"
          terraform apply -auto-approve -input=false -var-file="envs/${ENVIRONMENT}.tfvars"

      # ── Descoberta por SSM (nenhum terraform_remote_state entre repos) ─────
      - name: Ler parâmetros do SSM
        id: ssm
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text; }
          ECR_URL=$(get "/oficina/${ENVIRONMENT}/ecr/repository_url")
          CLUSTER=$(get  "/oficina/${ENVIRONMENT}/eks/cluster_name")
          TG_ARN=$(get   "/oficina/${ENVIRONMENT}/nlb/target_group_arn")
          NAMESPACE=$(get "/oficina/${ENVIRONMENT}/eks/namespace")
          QUEUE_URL=$(get "/oficina/${ENVIRONMENT}/os/queue_url")
          IRSA_ROLE=$(get "/oficina/${ENVIRONMENT}/os/irsa_role_arn")
          TOPIC_ARN=$(get "/oficina/${ENVIRONMENT}/messaging/topic_arn")
          {
            echo "ecr_url=$ECR_URL"
            echo "cluster_name=$CLUSTER"
            echo "target_group_arn=$TG_ARN"
            echo "namespace=$NAMESPACE"
            echo "queue_url=$QUEUE_URL"
            echo "irsa_role_arn=$IRSA_ROLE"
            echo "topic_arn=$TOPIC_ARN"
          } >> "$GITHUB_OUTPUT"

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # ── Imagem: tag = git sha (seção 8 dos Contratos) ──────────────────────
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.ssm.outputs.ecr_url }}:${{ github.sha }}
            ${{ steps.ssm.outputs.ecr_url }}:${{ env.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar kubeconfig do EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.ssm.outputs.cluster_name }}"

      # A license key não vive no Secrets Manager (é credencial de SaaS, não do
      # ambiente): vem do segredo de repositório e é aplicada como Secret
      # próprio, consumido com `optional: true` pelo Deployment.
      - name: Aplicar Secret da license key do New Relic
        id: nrsecret
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl -n "${{ steps.ssm.outputs.namespace }}" create secret generic oficina-newrelic \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Variavel de ambiente e' fixada no start do pod. Trocar o Secret nao
          # reinicia nada: se a imagem nao mudou, o apply nao ve diferenca no
          # Deployment, nao ha rollout, e os pods seguem com o valor antigo — o
          # agente continua inerte e ninguem percebe, porque nada falha.
          #
          # A anotacao com o hash da chave resolve sem reiniciar a toa: chave
          # diferente muda o pod template e dispara rollout; chave igual e' no-op.
          echo "keyhash=$(printf '%s' "$NEW_RELIC_LICENSE_KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # ── Manifests ─────────────────────────────────────────────────────────
      - name: Fixar imagem e ARN do target group no overlay
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
          (cd "$OVERLAY" && kustomize edit set image \
            "oficina-api=${{ steps.ssm.outputs.ecr_url }}:${{ github.sha }}")
          # O ARN do target group vem do SSM e varia por ambiente (adendo 1 dos
          # Contratos): o NLB e o TG são do repo oficina-infra-cluster.
          sed -i "s#TARGET_GROUP_ARN_PLACEHOLDER#${{ steps.ssm.outputs.target_group_arn }}#" \
            deploy/base/targetgroupbinding.yaml
          sed -i "s#IRSA_ROLE_ARN_PLACEHOLDER#${{ steps.ssm.outputs.irsa_role_arn }}#" \
            deploy/base/serviceaccount.yaml
          (cd "$OVERLAY" && kustomize edit add configmap oficina-config --behavior=merge \
            --from-literal=MESSAGING_TOPIC_ARN="${{ steps.ssm.outputs.topic_arn }}" \
            --from-literal=MESSAGING_QUEUE_URL="${{ steps.ssm.outputs.queue_url }}")
          # O Job de migration e aplicado fora do kustomize (Jobs sao imutaveis, um
          # apply -k repetido falharia), entao a imagem precisa ser fixada aqui tambem.
          sed -i "s#APP_IMAGE_PLACEHOLDER#${{ steps.ssm.outputs.ecr_url }}:${{ github.sha }}#" \
            deploy/base/migration-job.yaml
          # Ref das migrations: por padrão a mesma do branch em deploy.
          MIG_REF="${{ inputs.migrations_ref }}"
          if [ -z "$MIG_REF" ]; then
            MIG_REF="${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}"
          fi
          sed -i "s#^  MIGRATIONS_REF: .*#  MIGRATIONS_REF: \"$MIG_REF\"#" \
            deploy/base/migrations-configmap.yaml
          kubectl kustomize "$OVERLAY"

      # Antes do Job, só o que ele usa e o que não roda código (ConfigMaps, ExternalSecret,
      # ServiceAccount, Service): os Deployments ficam para depois da migration, para a versão
      # nova do código só subir com o schema que ela espera.
      - name: Aplicar configuração (sem os Deployments)
        run: |
          set -euo pipefail
          kubectl kustomize "$OVERLAY" > /tmp/manifests.yaml
          kubectl create --dry-run=client -o json -f /tmp/manifests.yaml \
            | jq '{apiVersion: "v1", kind: "List", items: [(if .kind == "List" then .items[] else . end)
                  | select(.kind | IN("Deployment", "HorizontalPodAutoscaler", "PodDisruptionBudget", "TargetGroupBinding") | not)]}' \
            | kubectl apply -f -

      # ── Migrations ────────────────────────────────────────────────────────
      # O Job aplica os SQL versionados que vêm do repo oficina-infra-fundacao
      # (clone em initContainer, ver deploy/base/migration-job.yaml).
      # A spec de um Job é imutável: apagamos e recriamos a cada deploy.
      - name: Rodar Job de migration
        env:
          NS: ${{ steps.ssm.outputs.namespace }}
        run: |
          set -euo pipefail
          kubectl -n "$NS" delete job oficina-migrate --ignore-not-found --wait=true
          kubectl -n "$NS" apply -f deploy/base/migration-job.yaml
          if ! kubectl -n "$NS" wait --for=condition=complete job/oficina-migrate --timeout=600s; then
            echo "::error::Job de migration falhou"
            # `logs job/...` nao devolve nada enquanto os initContainers nao terminam,
            # que e justamente o caso mais comum de travamento. Sem describe e sem
            # eventos, a falha chega aqui sem uma linha de diagnostico.
            echo "--- job ---";    kubectl -n "$NS" describe job oficina-migrate || true
            echo "--- pods ---";   kubectl -n "$NS" get pods -l job-name=oficina-migrate -o wide || true
            echo "--- describe ---"
            kubectl -n "$NS" describe pods -l job-name=oficina-migrate || true
            echo "--- eventos ---"
            kubectl -n "$NS" get events --sort-by=.lastTimestamp --field-selector involvedObject.kind=Pod | tail -30 || true
            echo "--- logs por container ---"
            for c in $(kubectl -n "$NS" get pods -l job-name=oficina-migrate \
                        -o jsonpath='{.items[0].spec.initContainers[*].name} {.items[0].spec.containers[*].name}' 2>/dev/null); do
              echo "== container $c"
              kubectl -n "$NS" logs job/oficina-migrate -c "$c" --tail=100 || true
            done
            exit 1
          fi
          kubectl -n "$NS" logs job/oficina-migrate --all-containers --tail=100

      - name: Aplicar manifests (Deployments, depois da migration)
        run: kubectl apply -k "$OVERLAY"

      - name: Propagar mudanca da license key para os pods
        run: |
          set -euo pipefail
          for deploy in oficina-api oficina-api-worker; do
            kubectl -n "${{ steps.ssm.outputs.namespace }}" patch deployment "$deploy" \
              -p '{"spec":{"template":{"metadata":{"annotations":{"oficina/newrelic-key-hash":"${{ steps.nrsecret.outputs.keyhash }}"}}}}}'
          done

      - name: Aguardar rollout
        env:
          NS: ${{ steps.ssm.outputs.namespace }}
        run: |
          set -euo pipefail
          for deploy in oficina-api oficina-api-worker; do
            if ! kubectl -n "$NS" rollout status "deployment/${deploy}" --timeout=600s; then
              kubectl -n "$NS" describe "deployment/${deploy}" || true
              kubectl -n "$NS" logs -l "app=${deploy}" --all-containers --tail=200 || true
              exit 1
            fi
          done

      # ── Smoke test ────────────────────────────────────────────────────────
      - name: Smoke test em /api/ready
        env:
          NS: ${{ steps.ssm.outputs.namespace }}
        run: |
          set -euo pipefail
          kubectl -n "$NS" port-forward svc/oficina-api 18080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/ready > /tmp/ready.json; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::/api/ready não respondeu"; cat /tmp/pf.log; exit 1; }
          cat /tmp/ready.json
          curl -fsS http://127.0.0.1:18080/api/health > /dev/null

      # ── New Relic ─────────────────────────────────────────────────────────
      # Converte "telemetria ausente" em falha de pipeline. Sem isto, o deploy fica
      # verde com o agente mudo, e a descoberta acontece dias depois, olhando um
      # grafico vazio.
      - name: Smoke de observabilidade
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Gera trafego para haver o que reportar.
          API=$(aws ssm get-parameter --name "/oficina/${ENVIRONMENT}/apigw/endpoint" \
                  --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -n "$API" ]; then
            for _ in 1 2 3 4 5; do curl -fsS "$API/api/health" >/dev/null || true; done
          fi
          python3 scripts/smoke-observabilidade.py --env "$ENVIRONMENT" --timeout 300

      - name: Marcar deployment no New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          APP_NAME="oficina-api-${ENVIRONMENT}"
          GUID=$(curl -sS -X POST https://api.newrelic.com/graphql \
            -H "Api-Key: $NEW_RELIC_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"query\":\"{ actor { entitySearch(query: \\\"name = '$APP_NAME' AND type = 'APPLICATION'\\\") { results { entities { guid } } } } }\"}" \
            | jq -r '.data.actor.entitySearch.results.entities[0].guid // empty')
          if [ -z "$GUID" ]; then
            echo "::warning::Entidade '$APP_NAME' não encontrada no New Relic; marcação ignorada."
            exit 0
          fi
          curl -sS -X POST https://api.newrelic.com/graphql \
            -H "Api-Key: $NEW_RELIC_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"query\":\"mutation { changeTrackingCreateDeployment(deployment: { entityGuid: \\\"$GUID\\\", version: \\\"${GITHUB_SHA}\\\", user: \\\"${GITHUB_ACTOR}\\\", deploymentType: BASIC, description: \\\"Deploy ${ENVIRONMENT} via GitHub Actions\\\" }) { deploymentId } }\"}"
